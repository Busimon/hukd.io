<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hukd — Launching Soon</title>
  <meta name="description" content="We're crafting something new. Stay tuned.">
  <meta name="theme-color" content="#07090E">
  <meta property="og:title" content="hukd — Launching Soon">
  <meta property="og:description" content="We're crafting something new. Stay tuned.">
  <meta property="og:url" content="https://hukd.io">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://hukd.io">
  <style>
    @font-face {
      font-family: Switzer;
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/switzer-400.woff2") format("woff2");
    }
    @font-face {
      font-family: Switzer;
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("fonts/switzer-500.woff2") format("woff2");
    }
    @font-face {
      font-family: Switzer;
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/switzer-700.woff2") format("woff2");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #07090e;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(100%, 720px);
      padding: 32px 20px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise 700ms ease both;
    }

    .keys {
      width: min(388px, 86vw);
      height: auto;
      margin: 0 0 28px;
      display: block;
      image-rendering: auto;
      user-select: none;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(40px, 7.2vw, 64px);
      font-weight: 700;
      letter-spacing: -0.038em;
      line-height: 1.05;
      margin: 0 0 16px;
    }

    .sub {
      font-size: 16px;
      font-weight: 400;
      color: #8b919c;
      letter-spacing: -0.011em;
      margin: 0 0 28px;
    }

    .mail {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #f3f4f6;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      background: #0a0c11;
      border: 1px solid #2c2e34;
      border-radius: 12px;
      padding: 10px 16px 10px 14px;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .mail:hover {
      background: #12141a;
      border-color: #3a3d45;
    }

    .mail:active { transform: translateY(1px); }

    .mail svg {
      width: 16px;
      height: 16px;
      flex: none;
      opacity: .92;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="keys"
      src="assets/keys.png"
      width="388"
      height="98"
      alt="i feel so hooked"
    >
    <h1>Launching Soon</h1>
    <p class="sub">We're crafting something new. Stay tuned.</p>
    <a class="mail" href="mailto:ask@hukd.io">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.2" y="5.5" width="17.6" height="13" rx="2.2" stroke="currentColor" stroke-width="1.7"/>
        <path d="M4 7.2 12 13l8-5.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      ask@hukd.io
    </a>
  </main>
</body>
</html>
